<main class="login-page">
  <section class="login-card">
    <svg class="spotify-logo" viewBox="0 0 24 24" role="img" aria-label="Spotify">
      <circle cx="12" cy="12" r="12" fill="#1ed760" />
      <path d="M5.6 9.1c4-1.2 8.6-.9 12.3 1.3" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" />
      <path d="M6.1 12.5c3.6-1 7.5-.7 10.6 1.1" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" />
      <path d="M6.7 15.7c3-.8 6.1-.6 8.7.9" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" />
    </svg>

    <h1>Inicia sesión en Spotify</h1>

    <div class="social-zone">
      <button type="button" class="social-btn">
        <i class="uil uil-facebook-f"></i> Continuar con Facebook
      </button>
      <button type="button" class="social-btn">
        <i class="uil uil-apple"></i> Continuar con Apple
      </button>
      <button type="button" class="social-btn">
        <i class="uil uil-google"></i> Continuar con Google
      </button>
      <button type="button" class="social-btn">
        <i class="uil uil-phone"></i> Continuar con número de teléfono
      </button>
    </div>

    <div class="divider"><span>o</span></div>

    <form (ngSubmit)="sendLogin()" [formGroup]="formLogin" class="login-form">
      <div class="field">
        <label for="login-email">Correo electrónico o nombre de usuario</label>
        <input
          id="login-email"
          formControlName="email"
          type="text"
          placeholder="nombre@ejemplo.com"
          autocomplete="username"
        />
      </div>

      <div class="field">
        <label for="login-password">Contraseña</label>
        <div class="password-input-container">
          <input
            id="login-password"
            formControlName="password"
            [type]="passwordFieldType"
            placeholder="Contraseña"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="toggle-password-btn"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="passwordFieldType === 'password' ? 'Mostrar contraseña' : 'Ocultar contraseña'"
          >
            <i class="uil" [ngClass]="passwordFieldType === 'password' ? 'uil-eye' : 'uil-eye-slash'"></i>
          </button>
        </div>
      </div>

      @if (errorSession) {
        <p class="login-error" role="alert">Ocurrió un error con tu correo o contraseña.</p>
      }

      <div class="form-action">
        <button [disabled]="formLogin.invalid" class="btn-primary" type="submit">Iniciar sesión</button>
      </div>

      <a class="forgot-link" href="">¿Se te olvidó la contraseña?</a>
    </form>

    <div class="signup">
      <p>¿No tienes cuenta?</p>
      <button type="button" class="social-btn" routerLink="/auth/register">Crear usuario</button>
    </div>
  </section>
</main>
