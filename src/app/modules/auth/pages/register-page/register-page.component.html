<div class="register-auth-page">
  <div class="register-auth-wrapper">
    <h3>Crear usuario</h3>
    <form (ngSubmit)="sendRegister()" [formGroup]="formRegister" class="register-auth-form">
      <div class="form-group">
        <label for="name">Nombre</label>
        <input formControlName="name" type="text" placeholder="Nombre" class="form-input" />
      </div>
      <div class="form-group">
        <label for="email">Correo</label>
        <input formControlName="email" type="email" placeholder="Correo electrónico" class="form-input" />
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input formControlName="password" type="password" placeholder="Contraseña (mín. 6)" class="form-input" />
      </div>

      @if (errorMessage) {
        <div class="register-error">{{ errorMessage }}</div>
      }

      <div class="form-action">
        <button type="submit" class="social-btn" [disabled]="formRegister.invalid || submitting">
          Crear usuario
        </button>
      </div>
    </form>
    <div class="form-steps">
      <a class="link" routerLink="/auth/login">Volver a iniciar sesión</a>
    </div>
  </div>
</div>
