<main class="register-page">
  <section class="register-card">
    <svg class="spotify-logo" viewBox="0 0 24 24" role="img" aria-label="Spotify">
      <circle cx="12" cy="12" r="12" fill="#1ed760" />
      <path d="M5.6 9.1c4-1.2 8.6-.9 12.3 1.3" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" />
      <path d="M6.1 12.5c3.6-1 7.5-.7 10.6 1.1" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" />
      <path d="M6.7 15.7c3-.8 6.1-.6 8.7.9" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" />
    </svg>

    <h1>Crea tu cuenta</h1>

    <form (ngSubmit)="sendRegister()" [formGroup]="formRegister" class="register-form">
      <div class="field">
        <label for="register-name">Nombre</label>
        <input id="register-name" formControlName="name" type="text" placeholder="Tu nombre" autocomplete="name" />
      </div>
      <div class="field">
        <label for="register-email">Correo electrónico</label>
        <input id="register-email" formControlName="email" type="email" placeholder="nombre@ejemplo.com" autocomplete="email" />
      </div>
      <div class="field">
        <label for="register-password">Contraseña</label>
        <input id="register-password" formControlName="password" type="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" />
      </div>

      @if (errorMessage) {
        <p class="register-error" role="alert">{{ errorMessage }}</p>
      }

      <div class="form-action">
        <button type="submit" class="btn-primary" [disabled]="formRegister.invalid || submitting">Crear usuario</button>
      </div>
    </form>

    <div class="signup">
      <p>¿Ya tienes cuenta?</p>
      <button type="button" class="social-btn" routerLink="/auth/login">Iniciar sesión</button>
    </div>
  </section>
</main>
