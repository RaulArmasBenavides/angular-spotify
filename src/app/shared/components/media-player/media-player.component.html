<footer class="media-player">
  <div class="media-player--grid">

    <!-- Izquierda: canción actual -->
    <div class="mp-left">
      @if (multimediaService.trackInfo$ | async; as track) {
        <img [src]="track.cover" alt="" class="cover">
        <div class="track-meta">
          <div class="track-title">{{ track.name }}</div>
          <div class="track-subtitle">{{ track.artist?.name }}</div>
        </div>
        <button class="btn-icon like"
                [class.active]="isLiked(track._id)"
                (click)="toggleLike(track)"
                [attr.aria-label]="isLiked(track._id) ? 'Quitar de Canciones que te gustan' : 'Me gusta'"
                title="Me gusta">
          <i class="uil" [ngClass]="isLiked(track._id) ? 'uil-heart' : 'uil-heart-medical'"></i>
        </button>
      }
    </div>

    <!-- Centro: controles y progreso -->
    <div class="mp-center">
      <div class="buttons-media">
        <button class="btn-icon" title="Anterior">
          <i class="uil uil-step-backward"></i>
        </button>
        <button class="btn-play" (click)="togglePlayer()" [attr.aria-label]="(isPlaying$ | async) ? 'Pausar' : 'Reproducir'">
          <i class="uil" [ngClass]="(isPlaying$ | async) ? 'uil-pause' : 'uil-play'"></i>
        </button>
        <button class="btn-icon" title="Siguiente">
          <i class="uil uil-step-forward"></i>
        </button>
      </div>

      <div class="media-linetime">
        <span class="time">{{ multimediaService.timeElapsed$ | async }}</span>
        <span #progressBar class="progress" (click)="handlePosition($event)">
          <span class="progress-fill" [style.width.%]="(multimediaService.playerPercentage$ | async) ?? 0"></span>
        </span>
        <span class="time">{{ multimediaService.timeRemaining$ | async }}</span>
      </div>
    </div>

    <!-- Derecha: opciones y volumen -->
    <div class="mp-right">
      <button class="btn-icon" title="Letras" [class.active]="lyricsOpen$ | async" (click)="toggleLyrics()">
        <i class="uil uil-microphone"></i>
      </button>
      <button class="btn-icon" title="Cola">
        <i class="uil uil-list-ui-alt"></i>
      </button>
      <button class="btn-icon" title="Dispositivos">
        <i class="uil uil-boombox"></i>
      </button>
      <button class="btn-icon" title="Silenciar" (click)="toggleVolume()">
        <i class="uil" [ngClass]="volume === 0 ? 'uil-volume-mute' : 'uil-volume'"></i>
      </button>
      <div class="volume-bar" (click)="onBarClick($event)"
        (mousedown)="onDragStart($event)"
        (document:mousemove)="onDragMove($event)"
        (document:mouseup)="onDragEnd($event)"
        (mouseleave)="onDragEnd($event)"
        (touchstart)="onDragStart($event)"
        (document:touchmove)="onDragMove($event)"
        (document:touchend)="onDragEnd($event)">
        <div class="volume-progress" [style.width.%]="volume"></div>
        <div class="volume-slider" [style.left.%]="volume"></div>
      </div>
    </div>

  </div>
</footer>
