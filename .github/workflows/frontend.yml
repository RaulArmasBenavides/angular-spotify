name: Frontend CI/CD

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  BUCKET: unir-g2001-artifacts-902105781083

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: browser-actions/setup-chrome@v1
      - run: npx ng test --watch=false --browsers=ChromeHeadless
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - run: npx ng build --configuration production

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx ng build --configuration production
      - name: Agregar web.config (ng build lo elimina)
        run: cp deploy/web.config dist/spotify/browser/web.config
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Empaquetar build y subir a S3
        run: |
          (cd dist/spotify/browser && zip -r "$GITHUB_WORKSPACE/front.zip" .)
          aws s3 cp front.zip s3://$BUCKET/front.zip
          aws s3 cp front.zip s3://$BUCKET/releases/front-${GITHUB_SHA}.zip
          aws s3 cp deploy/remote-frontend.ps1 s3://$BUCKET/deploy/remote-frontend.ps1

      - name: Desplegar en FRONT-APP-G2001 (SSM)
        run: |
          CMD_ID=$(aws ssm send-command --instance-ids "${{ secrets.FRONT_INSTANCE_ID }}" \
            --document-name AWS-RunPowerShellScript --timeout-seconds 600 \
            --parameters "commands=[\"Read-S3Object -BucketName $BUCKET -Key front.zip -File C:\front.zip\",\"Read-S3Object -BucketName $BUCKET -Key deploy/remote-frontend.ps1 -File C:\deploy-frontend.ps1\",\"& C:\deploy-frontend.ps1\"]" \
            --query Command.CommandId --output text)
          for i in $(seq 1 40); do
            ST=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ secrets.FRONT_INSTANCE_ID }}" --query Status --output text)
            case "$ST" in Success) break;; Failed|Cancelled|TimedOut) aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ secrets.FRONT_INSTANCE_ID }}" --query StandardErrorContent --output text; exit 1;; esac
            sleep 15
          done
          [ "$ST" = Success ] || { echo "timeout"; exit 1; }

      - name: Verificar salud en el ALB
        run: |
          for i in $(seq 1 30); do
            S=$(aws elbv2 describe-target-health --target-group-arn "${{ secrets.TG_FRONT_ARN }}" --query "TargetHealthDescriptions[0].TargetHealth.State" --output text)
            echo "estado=$S"
            [ "$S" = healthy ] && exit 0
            sleep 20
          done
          exit 1
